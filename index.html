<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7b1fa2">
    <title>Skins do Brawl Stars</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>⭐ Skins do Brawl Stars</h1>
        <p>Cadastre e explore as skins dos seus Brawlers favoritos</p>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Nova skin</h2>

        <form id="form-skin">
          <input type="hidden" id="skin-id">

          <label for="nome">Nome da skin</label>
          <input id="nome" name="nome" type="text" placeholder="Ex: Shark Leon" required>

          <label for="brawler">Brawler</label>
          <input id="brawler" name="brawler" type="text" placeholder="Ex: Leon" required>

          <label for="raridade">Raridade</label>
          <select id="raridade" name="raridade" required>
            <option value="">Selecione...</option>
            <option value="Rara">Rara</option>
            <option value="Super Rara">Super Rara</option>
            <option value="Épica">Épica</option>
            <option value="Mítica">Mítica</option>
            <option value="Lendária">Lendária</option>
            <option value="Cromada">Cromada</option>
          </select>

          <label for="preco">Preço (gemas)</label>
          <input id="preco" name="preco" type="number" min="0">

          <label for="imagemUrl">URL da imagem (opcional)</label>
          <input id="imagemUrl" name="imagemUrl" type="url" placeholder="https://...">

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Skins cadastradas</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar skin pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID da skin">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todas</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-skins" class="lista-skins"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
